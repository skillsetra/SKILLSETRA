# Explicit production profile. Create a private .env.production outside source control.
services:
  skillsetra-production:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-true}"
        BACKEND_INTERNAL_URL: "http://127.0.0.1:8000"
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      NEXT_PUBLIC_DEMO_MODE: "${NEXT_PUBLIC_DEMO_MODE:-true}"
      NEXT_PUBLIC_API_BASE_URL: ""
      DEMO_MODE: "${DEMO_MODE:-true}"
      ALLOW_PRODUCTION_DEMO: "${ALLOW_PRODUCTION_DEMO:-true}"
    restart: unless-stopped
